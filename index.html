<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蝉 · 测试版</title>
<style>
:root{
  --ink:#2c5a80; --ink2:#3a6a90; --ink3:#5a7a90;
  --line:rgba(140,190,230,.5);
  --card:rgba(255,255,255,.75);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

/* ========== 封面：雪地雪花 ========== */
#cover{
  position:fixed;inset:0;overflow:hidden;cursor:pointer;z-index:100;
  background:radial-gradient(ellipse at 50% 120%,#1e2a44 0%,#0d1420 60%,#05080f 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:20px;
}
#cover::after{
  content:"";position:absolute;bottom:0;left:0;width:100%;height:22%;pointer-events:none;
  background:linear-gradient(180deg,rgba(220,235,255,.05) 0%,rgba(200,220,245,.25) 40%,rgba(180,205,235,.5) 100%);
  border-radius:50% 50% 0 0 / 18% 18% 0 0;
}
#snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snowflake{
  position:absolute;top:-10px;color:#fff;user-select:none;pointer-events:none;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-10px) translateX(0) rotate(0deg);opacity:0}
  10%{opacity:.9}
  90%{opacity:.7}
  100%{transform:translateY(105vh) translateX(40px) rotate(360deg);opacity:0}
}
#cover h1{
  font-size:3rem;letter-spacing:10px;color:#dce9fb;font-weight:500;z-index:2;margin-bottom:0;
  text-shadow:0 0 18px rgba(150,190,240,.5),0 0 40px rgba(90,130,200,.3);
}
#logo{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-size:.9rem;letter-spacing:4px;color:#7a96b0;z-index:2;user-select:none;opacity:.85;
}

/* 眨眼遮罩 */
#blink{
  position:fixed;inset:0;background:#000;z-index:300;pointer-events:none;opacity:0;
}
.blink-twice{animation:blinkTwice 1.2s ease-in-out forwards}
@keyframes blinkTwice{
  0%{opacity:0}15%{opacity:1}30%{opacity:0}45%{opacity:1}60%{opacity:0}100%{opacity:0}
}

/* ========== 主页面 ========== */
#main{display:none;width:100%;height:100%;position:relative;
  background:linear-gradient(160deg,#eaf5fd 0%,#d9edfa 30%,#c9e4f7 60%,#e3f2fc 100%)}
#pages{width:100%;height:100%;overflow:hidden;position:relative;z-index:2}
#track{display:flex;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;padding:56px 24px 70px;
  -webkit-overflow-scrolling:touch}

.cicada-deco{position:absolute;color:rgba(80,130,180,.07);pointer-events:none;z-index:1}

/* 第1页 */
.hero{display:flex;align-items:baseline;justify-content:center;gap:18px;margin-top:10px}
.hero-name{font-size:4.2rem;color:var(--ink);letter-spacing:8px;font-weight:500;line-height:1;
  text-shadow:0 2px 12px rgba(120,170,220,.25)}
.hero-age{font-size:1.6rem;color:var(--ink3);letter-spacing:2px}
.tag-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}
.chip{padding:6px 16px;border-radius:20px;font-size:.85rem;letter-spacing:2px;color:var(--ink2);
  background:var(--card);border:1px solid var(--line)}
.section-label{text-align:center;font-size:1rem;letter-spacing:5px;color:var(--ink2);
  margin:42px 0 22px;position:relative}
.section-label::before,.section-label::after{content:"";position:absolute;top:50%;width:46px;height:1px}
.section-label::before{right:calc(50% + 36px);background:linear-gradient(90deg,transparent,rgba(120,170,220,.6))}
.section-label::after{left:calc(50% + 36px);background:linear-gradient(90deg,rgba(120,170,220,.6),transparent)}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto}
.skill-item{padding:20px 10px;border-radius:14px;text-align:center;font-size:1rem;letter-spacing:3px;
  color:var(--ink);background:var(--card);border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(120,160,210,.12);transition:transform .3s,box-shadow .3s}
.skill-item:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(120,160,210,.25)}
.skill-item.span-2{grid-column:1 / -1}

/* 渐显通用 */
.fade-item{opacity:0;transform:translateY(15px)}
@keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}

/* 通用页头 */
.page-head{text-align:center;font-size:1.6rem;letter-spacing:8px;color:var(--ink);
  margin-bottom:38px;font-weight:500}
.page-head::after{content:"";display:block;width:40px;height:3px;border-radius:2px;margin:14px auto 0;
  background:linear-gradient(90deg,transparent,#7fb3d5,transparent)}

/* 第2页 风格：左右交错 + 渐显 */
.style-list{display:flex;flex-direction:column;gap:16px;max-width:480px;margin:0 auto;padding:0 4%}
.style-item{padding:14px 26px;border-radius:30px;font-size:1rem;letter-spacing:3px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);width:fit-content;
  box-shadow:0 4px 14px rgba(120,160,210,.1);
  transition:transform .3s,box-shadow .3s;
  opacity:0;transform:translateY(15px)}
.style-item:nth-child(odd){align-self:flex-start}
.style-item:nth-child(even){align-self:flex-end}
.style-item:hover{transform:translateY(-3px) !important;box-shadow:0 10px 24px rgba(120,160,210,.25)}
@keyframes styleIn{to{opacity:1;transform:translateY(0)}}

/* 第3页 价目表：四行横条 */
.price-grid{display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
.price-card{padding:18px 24px;border-radius:16px;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(120,160,210,.12);transition:transform .3s,box-shadow .3s}
.price-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(120,160,210,.25)}
.price-name{font-size:1.1rem;color:var(--ink);letter-spacing:3px;font-weight:500}
.price-main{font-size:1.4rem;color:#1e7a5e;font-weight:bold;text-align:center}
.price-main small{font-size:.8rem;color:var(--ink3);font-weight:normal}
.price-half{font-size:.85rem;color:var(--ink3);letter-spacing:1px;text-align:right;white-space:nowrap}

/* 第4页 秘密：四宫格 2×2 */
.secret-list{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:520px;margin:0 auto}
.secret-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:30px 16px;border-radius:16px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(120,160,210,.12);transition:transform .3s,box-shadow .3s}
.secret-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(120,160,210,.28)}
.secret-icon{font-size:1.8rem}
.secret-name{font-size:1rem;letter-spacing:3px;text-align:center}
.secret-arrow{display:none}

/* 侧边提示箭头 */
.side-hint{position:fixed;top:50%;transform:translateY(-50%);font-size:2rem;
  color:rgba(90,150,200,.25);pointer-events:none;z-index:5;user-select:none}
.side-hint.left{left:12px}
.side-hint.right{right:12px}

/* 右上角页码 */
.page-num{position:fixed;top:18px;right:20px;font-size:.8rem;letter-spacing:2px;
  color:rgba(60,110,150,.5);z-index:5;user-select:none}

/* 手机适配 */
@media (max-width:600px){
  #cover h1{font-size:1.8rem;letter-spacing:8px}
  #logo{font-size:.75rem;bottom:28px}
  .page{padding:56px 18px 60px}
  .hero-name{font-size:3.2rem;letter-spacing:6px}
  .hero-age{font-size:1.3rem}
  .page-head{font-size:1.35rem;letter-spacing:5px}
  .style-item{font-size:.92rem;padding:12px 20px}
  .price-card{padding:16px 18px;gap:10px}
  .price-main{font-size:1.25rem}
  .secret-card{padding:24px 12px}
  .side-hint{font-size:1.5rem}
}
</style>
</head>
<body>

<!-- ========== 封面 ========== -->
<div id="cover" onclick="enterMain()">
  <div id="snow"></div>
  <h1>凛冬将至</h1>
  <div id="logo">蝉测试版</div>
</div>

<!-- 眨眼遮罩 -->
<div id="blink"></div>

<!-- ========== 主页面 ========== -->
<div id="main">
  <svg class="cicada-deco" style="top:5%;right:4%;width:180px;height:180px;transform:rotate(15deg)" viewBox="0 0 100 100" fill="currentColor">
    <circle cx="50" cy="20" r="7"/><ellipse cx="50" cy="55" rx="9" ry="24"/>
    <path d="M43 45 Q16 54 20 84 Q32 74 43 64 Z" opacity=".6"/>
    <path d="M57 45 Q84 54 80 84 Q68 74 57 64 Z" opacity=".6"/>
  </svg>
  <svg class="cicada-deco" style="bottom:8%;left:3%;width:140px;height:140px;transform:rotate(-25deg)" viewBox="0 0 100 100" fill="currentColor">
    <circle cx="50" cy="20" r="7"/><ellipse cx="50" cy="55" rx="9" ry="24"/>
    <path d="M43 45 Q16 54 20 84 Q32 74 43 64 Z" opacity=".6"/>
    <path d="M57 45 Q84 54 80 84 Q68 74 57 64 Z" opacity=".6"/>
  </svg>

  <div id="pages">
    <div id="track">

      <!-- 第1页 个人档案 -->
      <section class="page" id="page-1">
        <div class="hero fade-item">
          <div class="hero-name">蝉</div>
          <div class="hero-age">20</div>
        </div>
        <div class="tag-row fade-item">
          <span class="chip">INTJ</span>
          <span class="chip">Aceflux</span>
          <span class="chip">八无</span>
        </div>

        <div class="section-label fade-item">技能点</div>
        <div class="skill-grid">
          <div class="skill-item fade-item">树洞</div>
          <div class="skill-item fade-item">病恋</div>
          <div class="skill-item fade-item">虐恋</div>
          <div class="skill-item fade-item">资料制作</div>
          <div class="skill-item fade-item span-2">代肝</div>
        </div>
      </section>

      <!-- 第2页 风格 -->
      <section class="page" id="page-2">
        <div class="page-head">风格</div>
        <div class="style-list" id="styleList">
          <span class="style-item">二求为引导</span>
          <span class="style-item">剖析</span>
          <span class="style-item">黑色幽默</span>
          <span class="style-item">理智</span>
          <span class="style-item">反差</span>
          <span class="style-item">中恋</span>
          <span class="style-item">意识流</span>
          <span class="style-item">伪下</span>
        </div>
      </section>

      <!-- 第3页 价目表 -->
      <section class="page" id="page-3">
        <div class="page-head">价目表</div>
        <div class="price-grid">
          <div class="price-card">
            <div class="price-name">普</div>
            <div class="price-main">25<small> / 小时</small></div>
            <div class="price-half">半小时 14.5</div>
          </div>
          <div class="price-card">
            <div class="price-name">病</div>
            <div class="price-main">30<small> / 小时</small></div>
            <div class="price-half">半小时 17</div>
          </div>
          <div class="price-card">
            <div class="price-name">虐</div>
            <div class="price-main">30<small> / 小时</small></div>
            <div class="price-half">半小时 17</div>
          </div>
          <div class="price-card">
            <div class="price-name">树洞</div>
            <div class="price-main">40<small> / 小时</small></div>
            <div class="price-half">半小时 22</div>
          </div>
        </div>
      </section>

      <!-- 第4页 秘密 -->
      <section class="page" id="page-4">
        <div class="page-head">秘密</div>
        <div class="secret-list">
          <a class="secret-card" href=" " target="_blank">
            <span class="secret-icon">📋</span>
            <span class="secret-name">须知</span>
          </a >
          <a class="secret-card" href="https://www.kdocs.cn/l/你的WPS文档ID" target="_blank">
            <span class="secret-icon">🎴</span>
            <span class="secret-name">冠卡</span>
          </a >
          <a class="secret-card" href="https://www.kdocs.cn/l/你的WPS文档ID" target="_blank">
            <span class="secret-icon">💬</span>
            <span class="secret-name">话术</span>
          </a >
          <a class="secret-card" href="https://www.kdocs.cn/l/你的WPS文档ID" target="_blank">
            <span class="secret-icon">⭐</span>
            <span class="secret-name">板评</span>
          </a >
        </div>
      </section>

    </div>
  </div>

  <div class="side-hint left">‹</div>
  <div class="side-hint right">›</div>
  <div class="page-num" id="pageNum">1 / 4</div>
</div>

<script>
/* ========== 雪花生成 ========== */
(function createSnow(){
  const container = document.getElementById('snow');
  const count = 60;
  const chars = ['❄','❅','❆','·','*'];
  for(let i=0;i<count;i++){
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.textContent = chars[Math.floor(Math.random()*chars.length)];
    flake.style.fontSize = (Math.random()*14+8) + 'px';
    flake.style.left = (Math.random()*100) + '%';
    flake.style.animationDuration = (Math.random()*8+6) + 's';
    flake.style.animationDelay = (Math.random()*8) + 's';
    flake.style.opacity = (Math.random()*.6+.3).toFixed(2);
    container.appendChild(flake);
  }
})();

/* ========== 进入主页面：眨眼两次 ========== */
let entered = false;
function enterMain(){
  if(entered) return;
  entered = true;

  const blink = document.getElementById('blink');
  blink.classList.add('blink-twice');

  setTimeout(()=>{
    document.getElementById('cover').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    fadeInPage1();
  },1200);

  setTimeout(()=>{
    blink.classList.remove('blink-twice');
  },1300);
}

/* ========== 分页 ========== */
let current = 0;
const total = 4;
const track = document.getElementById('track');
const pageNum = document.getElementById('pageNum');
const pagesEls = document.querySelectorAll('.page');

function goTo(n){
  if(n < 0 || n >= total) return;
  current = n;
  track.style.transform = `translateX(-${n*100}%)`;
  pageNum.textContent = (n+1) + ' / ' + total;
  pagesEls[n].scrollTop = 0;

  if(n === 0) fadeInPage1();
  if(n === 1) fadeInStyleItems();
}

document.getElementById('main').addEventListener('click', function(e){
  if(e.target.closest('a')) return;
  const x = e.clientX;
  const w = window.innerWidth;
  if(x < w*0.28) goTo(current - 1);
  else if(x > w*0.72) goTo(current + 1);
});

/* ========== 第1页渐入 ========== */
function fadeInPage1(){
  const items = document.querySelectorAll('#page-1 .fade-item');
  items.forEach((el,i)=>{
    el.style.animation = 'none';
    void el.offsetHeight;
    el.style.animation = `fadeInUp .7s ease ${i*0.1}s forwards`;
  });
}

/* ========== 第2页风格渐显 ========== */
function fadeInStyleItems(){
  const items = document.querySelectorAll('#styleList .style-item');
  items.forEach((el,i)=>{
    el.style.animation = 'none';
    void el.offsetHeight;
    el.style.animation = `styleIn .6s ease ${i*0.08}s forwards`;
  });
}
</script>

</body>
</html>
